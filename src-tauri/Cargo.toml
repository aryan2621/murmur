[package]
name = "murmur"
version = "0.1.0"
description = "Private, local voice dictation and assistant"
edition = "2021"

[lib]
name = "murmur_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
cpal = "0.18"
arboard = "3"
hound = "3"
regex = "1"
chrono = "0.4"
dirs = "6"
tauri-plugin-autostart = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }
core-foundation = "0.10"
tauri-nspanel = "2.1"
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSPasteboardItem", "NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSString", "NSDate", "NSError", "NSURL", "NSDictionary"] }
objc2-vision = { version = "0.3", default-features = false, features = ["std", "VNRequest", "VNRecognizeTextRequest", "VNRequestHandler", "VNObservation", "VNTypes", "objc2-core-foundation"] }
objc2-event-kit = { version = "0.3", default-features = false, features = ["std", "block2", "EKEventStore", "EKEvent", "EKCalendarItem", "EKObject", "EKTypes", "EKCalendar"] }
# The AI voices' models (Kokoro, Orpheus' SNAC decoder). ONNX Runtime is downloaded at build time and linked statically.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-rustls", "api-27"] }
# The natural voice's pronunciation: misaki (Kokoro's own rules and dictionaries, built in) and,
# for words it doesn't know, a pure-Rust eSpeak NG with its English data built in.
misaki-rs = { version = "=0.6.0", default-features = false }
espeak-ng = { version = "=0.2.0", default-features = false, features = ["bundled-data-en", "bundled-data-hi"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = "0.16"
rdev = "0.5"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true
